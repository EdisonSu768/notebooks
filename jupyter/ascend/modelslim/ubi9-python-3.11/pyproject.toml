[project]
name = "modelslim-notebook-ascend"
version = "0.1.0"
requires-python = "==3.11.*"

dependencies = [
    # Core PyTorch/NPU wheels are installed by jupyter/ascend/install-pytorch-npu.sh.
    "tensorboard~=2.20.0",
    # Keep CodeFlare on the last pre-kube-authkit line so it can coexist with odh-elyra's kfp stack.
    "codeflare-sdk==0.34.0",
    # odh-elyra already pulls kfp transitively, but we keep it explicit to preserve the original workbench surface.
    "kfp~=2.15.2",

    # msModelSlim currently only ships public PyPI wheels up to CPython 3.11.
    "numpy~=1.26.4",
    # msmodelslim is installed via jupyter/ascend/install-pytorch-npu.sh because its
    # wheel ships a data/requirements.txt directory that uv cannot handle (EISDIR).
    # The official Qwen3.5 msModelSlim example requires transformers 5.2.0.
    # Keep huggingface-hub pinned to the known-good build; later transitive installs
    # in the Ascend stack can otherwise replace it with a release that breaks the
    # transformers 5.2.0 import path.
    "bracex==2.6",
    "easydict==1.13",
    "huggingface-hub==1.10.2",
    "transformers==5.2.0",
    # Qwen3.5-27B is a multimodal model and its AutoProcessor path needs these extra runtime deps.
    "torchvision==0.24.0",
    "mistral-common==1.11.0",
    "wcmatch==10.1",

    # Inline the datascience metapackage here because the shared
    # odh-notebooks-meta-workbench-datascience-deps package is 3.12-only today.
    "pandas~=2.3.3",
    "scikit-learn~=1.8.0",
    "scipy~=1.16.2",
    "matplotlib~=3.10.7",
    "plotly~=6.5.2",
    "onnxconverter-common~=1.16.0",
    "boto3~=1.42.29",
    "kafka-python-ng~=2.2.3",

    # Datascience and useful extensions
    # Feast intentionally stays out of this image: feast 0.60 requires numpy>=2,
    # which conflicts with the numpy 1.26 line used for the official msModelSlim route.
    "skl2onnx~=1.20.0",
    "onnxscript~=0.6.2",

    # DB connectors
    "pymongo~=4.16.0",
    "psycopg~=3.3.2",
    "pyodbc~=5.3.0",
    "mysql-connector-python~=9.6.0",

    # JupyterLab packages
    "odh-elyra==4.3.2",
    "odh-jupyter-trash-cleanup==0.1.1",

    "jupyterlab~=4.5.2",
    "jupyter-bokeh~=4.0.5",
    "jupyter-server~=2.17.0",
    "jupyter-server-proxy~=4.4.0",
    "jupyter-server-terminals~=0.5.3",
    "jupyterlab-git~=0.51.2",
    "jupyterlab-lsp~=5.1.1",
    "jupyterlab-widgets~=3.0.15",
    "jupyter-resource-usage~=1.1.1",
    "nbdime~=4.0.2",
    "nbgitpuller~=1.2.2",

    # Base packages
    "wheel~=0.46.3",
    "setuptools~=80.9.0",
]

[tool.uv]
environments = [
    "python_full_version >= '3.11' and python_full_version < '3.12' and sys_platform == 'linux' and implementation_name == 'cpython'",
]
override-dependencies = [
    # RHAIENG-2458: CVE-2025-66418 urllib3 - override needed because odh-elyra pulls in
    # appengine-python-standard which has an obnoxious urllib3<2 constraint
    "urllib3>=2.6.0",
    # AIPCC-8698: python-lsp-server[all] has conflicting pyflakes/pycodestyle requirements
    # The [all] extra pulls in linting tools we don't need at runtime
    # Using >= instead of ~= to allow broader compatibility during resolution
    # TODO: Remove this override before RHOAI 3.4 GA once AIPCC-8698 is resolved
    "python-lsp-server>=1.11.0",
]
